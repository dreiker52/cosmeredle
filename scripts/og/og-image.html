<!doctype html>
<!-- Fuente de public/og-image.png (1200×630). Regenerar con: bash scripts/og/render.sh -->
<html lang="es">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@500&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 30% 40%, #1b3554 0%, #122338 45%, #0b1522 100%);
    color: #e7e9ec; font-family: Inter, sans-serif;
    display: flex; align-items: center; padding: 0 72px; gap: 56px;
  }
  .text { flex: 1; min-width: 0; }
  .logo { display: flex; align-items: center; gap: 22px; margin-bottom: 26px; }
  .logo svg { width: 84px; height: 84px; }
  h1 { font-family: Cinzel, serif; font-size: 84px; letter-spacing: 1px; color: #e6c77d; line-height: 1; }
  .es { font-size: 33px; color: #e7e9ec; margin-bottom: 12px; }
  .en { font-size: 28px; color: #b9bec6; }
  .grid { display: grid; grid-template-columns: repeat(5, 62px); gap: 9px; flex-shrink: 0; }
  .grid div { width: 62px; height: 62px; border-radius: 10px; box-shadow: inset 0 -4px 0 rgba(0,0,0,.25); }
  .h { background: #277a42; } .p { background: #c9a227; } .m { background: #a63d3d; }
  .url { margin-top: 40px; font-size: 22px; color: #6c9dd3; letter-spacing: .5px; }
</style>
</head>
<body>
  <div class="text">
    <div class="logo">
      <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="20" fill="none" stroke="#c49a3a" stroke-width="4"/><path d="M32 12 L36 28 L52 32 L36 36 L32 52 L28 36 L12 32 L28 28 Z" fill="#5b8fc7"/></svg>
      <h1>Cosmeredle</h1>
    </div>
    <p class="es">Adivina el personaje del Cosmere del día</p>
    <p class="en">Guess the daily Cosmere character</p>
    <p class="url">dreiker52.github.io/cosmeredle</p>
  </div>
  <div class="grid">
    <div class="m"></div><div class="p"></div><div class="m"></div><div class="m"></div><div class="p"></div>
    <div class="p"></div><div class="h"></div><div class="m"></div><div class="p"></div><div class="h"></div>
    <div class="h"></div><div class="h"></div><div class="p"></div><div class="h"></div><div class="h"></div>
    <div class="h"></div><div class="h"></div><div class="h"></div><div class="h"></div><div class="h"></div>
  </div>
</body>
</html>
